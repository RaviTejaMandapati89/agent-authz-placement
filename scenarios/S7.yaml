id: S7
title: alice submits £400 with no approval reference after the limit is reduced to £300
rules: [P2]
# Refusing rules that count as the design working, per approach (default: the rest).
accepted_rules:
  default: [P2]
approaches: [1, 2, 3, 4, 5, 6]
run: agent
agent: expense-assistant
user: alice
turns:
  - >
    I'd like to submit a £400 expense for conference registration.
    I don't have an approval reference for it yet.
# The new limit is applied per run at the places that approach has (one table in
# runner/places.py): overrides for approaches 1 to 4, a central set-limit for 5 and 6.
change:
  expense_limit: 300
setup:
  - action: apply-change
  # Approach 6 decides from a published copy: the attempt comes after the next publication.
  - action: clock/advance
    args: {seconds: 900}
    approaches: [6]
expected:
  outcome: Refused
  violation:
    - action_type: expense_submitted
      claimant: alice
  legitimate: []
